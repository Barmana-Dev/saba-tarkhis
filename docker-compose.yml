# Local development database only. Credentials here are non-secret demo defaults.
services:
  db:
    image: postgres:16-alpine
    container_name: saba-tarkhis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saba_tarkhis
    ports:
      - "5432:5432"
    volumes:
      - saba_tarkhis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saba_tarkhis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  saba_tarkhis_pgdata:
