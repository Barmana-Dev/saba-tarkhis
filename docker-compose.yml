# Development stack for the whole product: PostgreSQL, the Express API and the
# Vite dev server that is proxied to the API. One command:
#
#   docker compose up -d        # then open http://localhost:3000
#
# Source folders are bind-mounted, so edits on the host hot-reload inside both
# containers. Demo accounts come from the seed (password Demo@12345). For a
# production deployment use docker-compose.prod.yml instead.
services:
  db:
    image: postgres:16-alpine
    container_name: saba-tarkhis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saba_tarkhis
    ports:
      - "5432:5432"
    volumes:
      - saba_tarkhis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saba_tarkhis"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Everything else falls back to the defaults in apps/api/src/config/env.ts.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/saba_tarkhis?schema=public
      # Must match the origin the browser uses: it is checked against the
      # Origin header on state-changing requests and used for session cookies.
      APP_ORIGIN: http://localhost:${WEB_PORT:-3000}
      SEED_DEMO_PASSWORD: Demo@12345
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    depends_on:
      api:
        condition: service_healthy
    environment:
      # The dev server proxies /api to the API container, so cookies stay
      # first-party and the browser only ever talks to the published web port.
      API_PROXY_TARGET: http://api:4000
      APP_ORIGIN: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules

volumes:
  saba_tarkhis_pgdata:
