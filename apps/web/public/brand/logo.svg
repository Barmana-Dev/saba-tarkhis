<svg xmlns="http://www.w3.org/2000/svg" viewBox="53 103 411 294" width="411" height="294">
  <defs>
    <!-- گرادیان فیروزه‌ای برای وجه راست جعبه -->
    <linearGradient id="cyanBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38B2AC" />
      <stop offset="100%" stop-color="#1D8A99" />
    </linearGradient>
    
    <!-- گرادیان فیروزه‌ای برای فلش پویا -->
    <linearGradient id="arrowGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38B2AC" />
      <stop offset="100%" stop-color="#1A7F8E" />
    </linearGradient>
  </defs>

  <!-- گروه اصلی آیکون -->
  <g id="saba-tarkhis-icon">
    
    <!-- وجه بالایی جعبه (سرمه‌ای تیره با نوار چسب سفید در وسط) -->
    <!-- نیمه چپ سقف -->
    <path d="M 256 115 L 152 162 L 188 178 L 292 131 Z" fill="#102A54" />
    <!-- نیمه راست سقف -->
    <path d="M 308 138 L 204 185 L 256 208 L 360 162 Z" fill="#102A54" />

    <!-- وجه چپ جعبه (سرمه‌ای تیره با برش نوار چسب و فضای خالی برای عبور فلش) -->
    <!-- بخش بالایی وجه چپ -->
    <path d="M 144 171 L 184 189 L 184 228 L 212 240 L 212 201 L 250 218 L 250 282 C 215 292, 175 288, 144 272 Z" fill="#102A54" />
    <!-- بخش پایینی وجه چپ (زیر فلش) -->
    <path d="M 144 316 C 178 332, 215 335, 250 326 L 250 385 L 144 338 Z" fill="#102A54" />

    <!-- وجه راست جعبه (فیروزه‌ای چندضلعی با برش برای عبور فلش) -->
    <!-- بخش بالایی وجه راست -->
    <path d="M 262 218 L 368 171 L 368 232 C 335 245, 298 262, 262 278 Z" fill="url(#cyanBoxGrad)" />
    <!-- مثلث تیره برای ایجاد حس چندضلعی در بخش بالا -->
    <path d="M 315 194 L 368 171 L 368 232 Z" fill="#2396A5" opacity="0.6" />
    
    <!-- بخش پایینی وجه راست (زیر فلش) -->
    <path d="M 262 322 C 300 306, 336 288, 368 274 L 368 338 L 262 385 Z" fill="url(#cyanBoxGrad)" />
    <!-- خط برش مورب سفید در پایین وجه راست -->
    <path d="M 295 370 C 318 345, 342 322, 368 308 L 368 318 C 344 332, 322 352, 306 365 Z" fill="#FFFFFF" />

    <!-- فلش منحنی پویا (نماد سرعت و ترخیص) -->
    <!-- دنباله موج‌دار سمت چپ فلش -->
    <path d="M 65 256 C 100 238, 138 258, 175 268 C 142 268, 112 254, 65 256 Z" fill="#2BA4B0" />
    
    <!-- بدنه اصلی و نوک فلش -->
    <path d="M 92 268 
             C 155 312, 265 288, 382 222 
             L 368 202 
             L 452 208 
             L 415 284 
             L 402 262 
             C 280 328, 152 338, 92 268 Z" fill="url(#arrowGrad)" />
          
    <!-- سایه ظریف روی بدنه فلش برای ایجاد عمق -->
    <path d="M 115 282 C 185 322, 285 302, 396 244 L 402 262 C 280 328, 152 338, 115 282 Z" fill="#156B78" opacity="0.45" />

  </g>
</svg>