<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 170 920 600" role="img" aria-label="بندر و کشتی کانتینری در حال بارگیری">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1e2f" />
      <stop offset="1" stop-color="#183a58" />
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142f47" />
      <stop offset="1" stop-color="#0c1e2f" />
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.42" />
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="crane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#245885" />
      <stop offset="1" stop-color="#183a58" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)" />
  <rect width="1200" height="800" fill="url(#glow)" />

  <g fill="#8cb2d4" opacity="0.22">
    <circle cx="150" cy="120" r="3" />
    <circle cx="230" cy="80" r="2" />
    <circle cx="320" cy="150" r="2.5" />
    <circle cx="905" cy="95" r="3" />
    <circle cx="1010" cy="150" r="2" />
    <circle cx="1100" cy="90" r="2.5" />
    <circle cx="780" cy="140" r="2" />
  </g>

  <!-- distant skyline / cranes -->
  <g fill="url(#crane)" opacity="0.55">
    <rect x="70" y="400" width="16" height="150" />
    <rect x="60" y="400" width="120" height="10" />
    <path d="M170 400 h10 v150 h-10z" />
    <rect x="300" y="420" width="14" height="130" />
    <rect x="292" y="420" width="96" height="8" />
    <path d="M380 420 h8 v130 h-8z" />
  </g>

  <!-- water -->
  <rect y="545" width="1200" height="255" fill="url(#water)" />
  <g stroke="#356fa1" stroke-opacity="0.45" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M80 620 q40 -14 80 0 q40 14 80 0" />
    <path d="M330 668 q40 -14 80 0 q40 14 80 0" />
    <path d="M640 705 q40 -14 80 0 q40 14 80 0" />
    <path d="M900 640 q40 -14 80 0 q40 14 80 0" />
    <path d="M150 740 q40 -14 80 0 q40 14 80 0" />
  </g>

  <!-- hull -->
  <g>
    <path d="M250 520 h660 l-58 96 q-16 26 -48 26 H356 q-34 0 -52 -28 z" fill="#1d466b" />
    <path d="M250 520 h660 l-12 20 H262 z" fill="#245885" />
    <rect x="300" y="556" width="120" height="14" rx="7" fill="#0c1e2f" opacity="0.4" />
  </g>

  <!-- containers -->
  <g>
    <rect x="330" y="470" width="84" height="46" rx="4" fill="#14b8a6" />
    <rect x="422" y="470" width="84" height="46" rx="4" fill="#245885" />
    <rect x="514" y="470" width="84" height="46" rx="4" fill="#8cb2d4" />
    <rect x="606" y="470" width="84" height="46" rx="4" fill="#14b8a6" opacity="0.85" />
    <rect x="698" y="470" width="84" height="46" rx="4" fill="#356fa1" />
    <rect x="790" y="470" width="84" height="46" rx="4" fill="#245885" />

    <rect x="376" y="420" width="84" height="46" rx="4" fill="#356fa1" />
    <rect x="468" y="420" width="84" height="46" rx="4" fill="#14b8a6" opacity="0.75" />
    <rect x="560" y="420" width="84" height="46" rx="4" fill="#8cb2d4" />
    <rect x="652" y="420" width="84" height="46" rx="4" fill="#245885" />
    <rect x="744" y="420" width="84" height="46" rx="4" fill="#14b8a6" />

    <rect x="514" y="370" width="84" height="46" rx="4" fill="#8cb2d4" opacity="0.9" />
    <rect x="606" y="370" width="84" height="46" rx="4" fill="#356fa1" />
    <rect x="698" y="370" width="84" height="46" rx="4" fill="#245885" />
  </g>

  <!-- crane arm reaching the ship -->
  <g stroke="#8cb2d4" stroke-width="6" fill="none" opacity="0.75">
    <path d="M930 260 h-250" />
    <path d="M930 260 v145" />
    <path d="M680 260 v70" />
    <path d="M680 330 h34" />
  </g>
  <rect x="670" y="330" width="54" height="34" rx="4" fill="#14b8a6" opacity="0.9" />

  <!-- foreground dock -->
  <path d="M0 760 h1200 v40 H0z" fill="#0c1e2f" opacity="0.55" />
</svg>
