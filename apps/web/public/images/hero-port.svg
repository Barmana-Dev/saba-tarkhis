<svg xmlns="http://www.w3.org/2000/svg" viewBox="170 200 900 580" role="img" aria-label="تصویرسازی بندر کانتینری: جرثقیل‌های دروازه‌ای و کشتی باری در حال بارگیری">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081627" />
      <stop offset="0.55" stop-color="#0f2941" />
      <stop offset="1" stop-color="#1d466b" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d466b" />
      <stop offset="0.35" stop-color="#142f47" />
      <stop offset="1" stop-color="#081627" />
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b6698" />
      <stop offset="1" stop-color="#12314c" />
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cb2d4" stop-opacity="0.55" />
      <stop offset="1" stop-color="#245885" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.72" r="0.62">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.34" />
      <stop offset="0.55" stop-color="#14b8a6" stop-opacity="0.08" />
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect width="1200" height="780" fill="url(#sky)" />
  <rect width="1200" height="780" fill="url(#glow)" />

  <!-- stars -->
  <g fill="#cfe3f3" opacity="0.55">
    <circle cx="96" cy="70" r="1.8" />
    <circle cx="212" cy="128" r="1.4" />
    <circle cx="338" cy="54" r="1.7" />
    <circle cx="470" cy="104" r="1.3" />
    <circle cx="612" cy="46" r="1.6" />
    <circle cx="742" cy="112" r="1.4" />
    <circle cx="884" cy="62" r="1.8" />
    <circle cx="1010" cy="120" r="1.3" />
    <circle cx="1128" cy="58" r="1.6" />
    <circle cx="1052" cy="196" r="1.2" />
    <circle cx="168" cy="206" r="1.2" />
  </g>

  <!-- distant skyline -->
  <g fill="#0b2033" opacity="0.85">
    <rect x="0" y="498" width="86" height="62" />
    <rect x="92" y="516" width="54" height="44" />
    <rect x="150" y="488" width="40" height="72" />
    <rect x="196" y="512" width="72" height="48" />
    <rect x="274" y="500" width="34" height="60" />
    <rect x="900" y="486" width="46" height="74" />
    <rect x="952" y="510" width="64" height="50" />
    <rect x="1022" y="492" width="38" height="68" />
    <rect x="1066" y="514" width="58" height="46" />
    <rect x="1130" y="500" width="70" height="60" />
  </g>
  <g fill="#8cb2d4" opacity="0.4">
    <rect x="18" y="514" width="4" height="4" /><rect x="34" y="514" width="4" height="4" />
    <rect x="18" y="530" width="4" height="4" /><rect x="50" y="530" width="4" height="4" />
    <rect x="166" y="508" width="4" height="4" /><rect x="166" y="526" width="4" height="4" />
    <rect x="1038" y="512" width="4" height="4" /><rect x="1038" y="530" width="4" height="4" />
    <rect x="1150" y="520" width="4" height="4" /><rect x="1172" y="520" width="4" height="4" />
  </g>

  <!-- water -->
  <rect y="560" width="1200" height="220" fill="url(#sea)" />

  <!-- far gantry crane, faint -->
  <g stroke="#356fa1" stroke-width="5" fill="none" opacity="0.35" stroke-linecap="round">
    <path d="M84 560 V470 M140 560 V470" />
    <path d="M60 470 H210" />
    <path d="M170 470 V420" />
  </g>

  <!-- main gantry cranes -->
  <g>
    <!-- crane 1 -->
    <g stroke="#7ea7c9" stroke-width="7" fill="none" stroke-linecap="square" opacity="0.9">
      <path d="M916 560 V376" />
      <path d="M980 560 V376" />
      <path d="M760 376 H1180" />
      <path d="M916 434 H980" />
      <path d="M916 492 H980" />
      <path d="M916 376 L980 560" opacity="0.45" />
      <path d="M980 376 L916 560" opacity="0.45" />
    </g>
    <g fill="#245885">
      <rect x="900" y="352" width="96" height="26" rx="6" />
      <rect x="1000" y="366" width="46" height="22" rx="5" fill="#1d466b" />
    </g>
    <!-- trolley + spreader + container being lowered -->
    <g>
      <rect x="846" y="370" width="34" height="16" rx="4" fill="#14b8a6" />
      <path d="M858 386 V430 M868 386 V430" stroke="#cfe3f3" stroke-width="3" opacity="0.7" />
      <rect x="836" y="430" width="54" height="26" rx="3" fill="#14b8a6" />
      <g stroke="#0d9488" stroke-width="2" opacity="0.8">
        <path d="M846 430 V456 M858 430 V456 M870 430 V456 M882 430 V456" />
      </g>
    </g>
    <!-- crane 2 -->
    <g stroke="#5f8fb6" stroke-width="6" fill="none" opacity="0.7" stroke-linecap="square">
      <path d="M1084 560 V412" />
      <path d="M1140 560 V412" />
      <path d="M1006 412 H1178" />
      <path d="M1084 470 H1140" />
    </g>
    <rect x="1072" y="392" width="80" height="22" rx="5" fill="#1d466b" opacity="0.9" />
    <!-- crane lights -->
    <g fill="#facc15" opacity="0.85">
      <circle cx="760" cy="376" r="4" />
      <circle cx="1180" cy="376" r="4" />
      <circle cx="1006" cy="412" r="3.5" />
      <circle cx="1178" cy="412" r="3.5" />
    </g>
  </g>

  <!-- ship -->
  <g>
    <!-- reflection under the hull -->
    <ellipse cx="490" cy="640" rx="330" ry="26" fill="#14b8a6" opacity="0.1" />

    <!-- hull -->
    <path d="M186 560 H792 L764 632 Q756 650 732 650 H292 Q266 650 254 630 Z" fill="url(#hull)" />
    <path d="M186 560 H792 L785 578 H214 Z" fill="#8cb2d4" opacity="0.28" />
    <rect x="262" y="590" width="470" height="6" rx="3" fill="#081627" opacity="0.35" />
    <rect x="300" y="608" width="120" height="10" rx="5" fill="#0d9488" opacity="0.55" />

    <!-- deck plate -->
    <rect x="248" y="548" width="548" height="14" rx="4" fill="url(#deck)" />

    <!-- superstructure -->
    <g>
      <rect x="690" y="452" width="98" height="96" rx="6" fill="#e8f1f8" />
      <rect x="690" y="452" width="98" height="10" rx="3" fill="#b9d1e7" />
      <g fill="#245885" opacity="0.9">
        <rect x="704" y="474" width="18" height="14" rx="2" />
        <rect x="730" y="474" width="18" height="14" rx="2" />
        <rect x="756" y="474" width="18" height="14" rx="2" />
        <rect x="704" y="502" width="18" height="14" rx="2" />
        <rect x="730" y="502" width="18" height="14" rx="2" />
        <rect x="756" y="502" width="18" height="14" rx="2" />
      </g>
      <rect x="714" y="528" width="50" height="20" rx="4" fill="#b9d1e7" opacity="0.8" />
      <!-- bridge wings -->
      <rect x="676" y="470" width="14" height="8" rx="3" fill="#cfe3f3" />
      <rect x="788" y="470" width="14" height="8" rx="3" fill="#cfe3f3" />
      <!-- funnel -->
      <rect x="742" y="418" width="30" height="38" rx="4" fill="#1d466b" />
      <rect x="742" y="426" width="30" height="8" fill="#14b8a6" opacity="0.9" />
      <!-- mast -->
      <path d="M716 452 V420" stroke="#cfe3f3" stroke-width="4" />
      <circle cx="716" cy="416" r="4" fill="#facc15" />
    </g>

    <!-- container stacks -->
    <g>
      <!-- tier 1 -->
      <g>
        <rect x="292" y="500" width="42" height="46" rx="3" fill="#14b8a6" />
        <rect x="338" y="500" width="42" height="46" rx="3" fill="#245885" />
        <rect x="384" y="500" width="42" height="46" rx="3" fill="#8cb2d4" />
        <rect x="430" y="500" width="42" height="46" rx="3" fill="#1d466b" />
        <rect x="476" y="500" width="42" height="46" rx="3" fill="#14b8a6" opacity="0.8" />
        <rect x="522" y="500" width="42" height="46" rx="3" fill="#356fa1" />
        <rect x="568" y="500" width="42" height="46" rx="3" fill="#8cb2d4" opacity="0.9" />
        <rect x="614" y="500" width="42" height="46" rx="3" fill="#245885" />
        <rect x="660" y="500" width="24" height="46" rx="3" fill="#14b8a6" opacity="0.7" />
      </g>
      <!-- tier 2 -->
      <g>
        <rect x="314" y="452" width="42" height="46" rx="3" fill="#245885" />
        <rect x="360" y="452" width="42" height="46" rx="3" fill="#14b8a6" opacity="0.85" />
        <rect x="406" y="452" width="42" height="46" rx="3" fill="#356fa1" />
        <rect x="452" y="452" width="42" height="46" rx="3" fill="#8cb2d4" />
        <rect x="498" y="452" width="42" height="46" rx="3" fill="#1d466b" />
        <rect x="544" y="452" width="42" height="46" rx="3" fill="#14b8a6" />
        <rect x="590" y="452" width="42" height="46" rx="3" fill="#8cb2d4" opacity="0.8" />
        <rect x="636" y="452" width="42" height="46" rx="3" fill="#245885" />
      </g>
      <!-- tier 3 -->
      <g>
        <rect x="360" y="404" width="42" height="46" rx="3" fill="#8cb2d4" />
        <rect x="406" y="404" width="42" height="46" rx="3" fill="#245885" />
        <rect x="452" y="404" width="42" height="46" rx="3" fill="#14b8a6" opacity="0.75" />
        <rect x="498" y="404" width="42" height="46" rx="3" fill="#356fa1" />
        <rect x="544" y="404" width="42" height="46" rx="3" fill="#8cb2d4" opacity="0.9" />
        <rect x="590" y="404" width="42" height="46" rx="3" fill="#1d466b" />
      </g>
      <!-- corrugation -->
      <g stroke="#081627" stroke-width="1.5" opacity="0.18">
        <path d="M302 500 V546 M312 500 V546 M322 500 V546 M332 500 V546 M348 500 V546 M358 500 V546" />
        <path d="M324 452 V498 M334 452 V498 M344 452 V498 M354 452 V498 M370 452 V498 M380 452 V498" />
        <path d="M370 404 V450 M380 404 V450 M390 404 V450 M400 404 V450 M416 404 V450 M426 404 V450" />
        <path d="M440 500 V546 M450 500 V546 M460 500 V546 M470 500 V546" />
        <path d="M606 452 V498 M616 452 V498 M626 452 V498 M642 452 V498 M652 452 V498" />
      </g>
    </g>

    <!-- cable from crane to the container being loaded -->
    <path d="M862 456 V404" stroke="#cfe3f3" stroke-width="3" stroke-dasharray="7 6" opacity="0.65" />
  </g>

  <!-- harbor water detail -->
  <g stroke="#356fa1" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M96 616 q30 -10 60 0 q30 10 60 0" />
    <path d="M268 660 q30 -10 60 0 q30 10 60 0" />
    <path d="M470 700 q30 -10 60 0 q30 10 60 0" />
    <path d="M640 672 q30 -10 60 0 q30 10 60 0" />
    <path d="M850 636 q30 -10 60 0 q30 10 60 0" />
    <path d="M980 700 q30 -10 60 0 q30 10 60 0" />
    <path d="M180 736 q30 -10 60 0 q30 10 60 0" />
  </g>
  <g stroke="#8cb2d4" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.28">
    <path d="M330 706 q26 -8 52 0 q26 8 52 0" />
    <path d="M760 716 q26 -8 52 0 q26 8 52 0" />
  </g>

  <!-- lit reflection of the ship's lights on the water -->
  <g fill="#facc15" opacity="0.18">
    <rect x="700" y="654" width="4" height="26" rx="2" />
    <rect x="716" y="660" width="4" height="22" rx="2" />
    <rect x="752" y="652" width="4" height="30" rx="2" />
    <rect x="770" y="662" width="4" height="20" rx="2" />
  </g>

  <!-- gulls -->
  <g stroke="#cfe3f3" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.45">
    <path d="M560 300 q10 -8 20 0 q10 -8 20 0" />
    <path d="M620 268 q8 -7 16 0 q8 -7 16 0" />
    <path d="M500 340 q7 -6 14 0 q7 -6 14 0" />
  </g>
</svg>
