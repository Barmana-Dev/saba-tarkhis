<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-label="بررسی اسناد و چک‌لیست مدارک گمرکی روی میز کار">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff5fa" />
      <stop offset="1" stop-color="#dbe8f3" />
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d1e7" />
      <stop offset="1" stop-color="#8cb2d4" />
    </linearGradient>
  </defs>

  <rect width="1000" height="750" fill="url(#bgA)" />

  <!-- soft circles -->
  <circle cx="140" cy="120" r="90" fill="#14b8a6" opacity="0.12" />
  <circle cx="880" cy="600" r="120" fill="#245885" opacity="0.08" />

  <!-- desk -->
  <path d="M0 590 h1000 v160 H0z" fill="url(#desk)" />
  <path d="M0 590 h1000 v14 H0z" fill="#245885" opacity="0.25" />

  <!-- documents stack -->
  <g>
    <rect x="150" y="300" width="330" height="290" rx="14" fill="#ffffff" transform="rotate(-6 315 445)" />
    <rect x="185" y="285" width="330" height="290" rx="14" fill="#ffffff" transform="rotate(-2 350 430)" />
    <rect x="215" y="270" width="330" height="290" rx="14" fill="#ffffff" stroke="#dbe8f3" stroke-width="2" />
    <!-- header bar -->
    <rect x="245" y="300" width="150" height="16" rx="8" fill="#245885" />
    <rect x="245" y="326" width="96" height="10" rx="5" fill="#8cb2d4" />
    <!-- lines -->
    <g fill="#dbe8f3">
      <rect x="245" y="368" width="270" height="10" rx="5" />
      <rect x="245" y="392" width="230" height="10" rx="5" />
      <rect x="245" y="416" width="258" height="10" rx="5" />
      <rect x="245" y="440" width="190" height="10" rx="5" />
      <rect x="245" y="464" width="246" height="10" rx="5" />
    </g>
    <!-- check rows -->
    <g>
      <circle cx="258" cy="504" r="9" fill="#14b8a6" />
      <path d="M253 504 l4 4 l7 -8" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="276" y="499" width="120" height="9" rx="4.5" fill="#8cb2d4" />
      <circle cx="258" cy="532" r="9" fill="#14b8a6" opacity="0.55" />
      <path d="M253 532 l4 4 l7 -8" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="276" y="527" width="96" height="9" rx="4.5" fill="#8cb2d4" />
    </g>
  </g>

  <!-- magnifier over the document -->
  <g>
    <circle cx="600" cy="380" r="96" fill="#ffffff" opacity="0.55" />
    <circle cx="600" cy="380" r="96" fill="none" stroke="#1d466b" stroke-width="14" />
    <circle cx="600" cy="380" r="96" fill="none" stroke="#14b8a6" stroke-width="4" opacity="0.6" />
    <path d="M668 448 l86 86" stroke="#1d466b" stroke-width="22" stroke-linecap="round" />
    <path d="M560 372 h82 M560 404 h58" stroke="#245885" stroke-width="10" stroke-linecap="round" opacity="0.55" />
  </g>

  <!-- checklist card -->
  <g>
    <rect x="690" y="150" width="230" height="170" rx="16" fill="#ffffff" stroke="#dbe8f3" stroke-width="2" />
    <rect x="714" y="176" width="110" height="12" rx="6" fill="#245885" />
    <g fill="#14b8a6">
      <rect x="714" y="208" width="22" height="22" rx="6" />
      <rect x="714" y="244" width="22" height="22" rx="6" opacity="0.7" />
      <rect x="714" y="280" width="22" height="22" rx="6" opacity="0.4" />
    </g>
    <g fill="#dbe8f3">
      <rect x="748" y="214" width="140" height="10" rx="5" />
      <rect x="748" y="250" width="112" height="10" rx="5" />
      <rect x="748" y="286" width="126" height="10" rx="5" />
    </g>
  </g>

  <!-- small container blocks as a motif -->
  <g opacity="0.9">
    <rect x="700" y="560" width="110" height="62" rx="8" fill="#14b8a6" />
    <rect x="820" y="560" width="110" height="62" rx="8" fill="#245885" />
    <rect x="760" y="490" width="110" height="62" rx="8" fill="#8cb2d4" />
  </g>
</svg>
