<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="مسیر حمل کالا از بندر تا انبار با کامیون و کانتینر">
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fb" />
      <stop offset="1" stop-color="#dbe8f3" />
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#356fa1" />
      <stop offset="1" stop-color="#1d466b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bgS)" />

  <circle cx="1030" cy="130" r="96" fill="#14b8a6" opacity="0.12" />
  <circle cx="180" cy="560" r="70" fill="#245885" opacity="0.08" />

  <!-- route -->
  <path
    d="M170 470 C 380 470, 380 300, 600 300 S 830 300, 1000 300"
    fill="none"
    stroke="#8cb2d4"
    stroke-width="8"
    stroke-linecap="round"
    stroke-dasharray="26 22"
  />

  <!-- pins -->
  <g>
    <circle cx="170" cy="470" r="20" fill="#14b8a6" />
    <circle cx="170" cy="470" r="8" fill="#ffffff" />
    <circle cx="1000" cy="300" r="20" fill="#1d466b" />
    <circle cx="1000" cy="300" r="8" fill="#ffffff" />
  </g>

  <!-- containers -->
  <g>
    <rect x="250" y="392" width="150" height="84" rx="10" fill="#14b8a6" />
    <rect x="418" y="392" width="150" height="84" rx="10" fill="#245885" />
    <g fill="#ffffff" opacity="0.28">
      <rect x="266" y="404" width="10" height="60" rx="5" />
      <rect x="292" y="404" width="10" height="60" rx="5" />
      <rect x="318" y="404" width="10" height="60" rx="5" />
      <rect x="344" y="404" width="10" height="60" rx="5" />
      <rect x="370" y="404" width="10" height="60" rx="5" />
      <rect x="434" y="404" width="10" height="60" rx="5" />
      <rect x="460" y="404" width="10" height="60" rx="5" />
      <rect x="486" y="404" width="10" height="60" rx="5" />
      <rect x="512" y="404" width="10" height="60" rx="5" />
      <rect x="538" y="404" width="10" height="60" rx="5" />
    </g>
  </g>

  <!-- truck -->
  <g transform="translate(620 380)">
    <!-- trailer -->
    <rect x="0" y="20" width="260" height="120" rx="12" fill="#ffffff" stroke="#b9d1e7" stroke-width="3" />
    <rect x="22" y="44" width="94" height="72" rx="8" fill="#dbe8f3" />
    <rect x="130" y="44" width="108" height="10" rx="5" fill="#b9d1e7" />
    <rect x="130" y="66" width="86" height="10" rx="5" fill="#dbe8f3" />
    <rect x="130" y="88" width="100" height="10" rx="5" fill="#dbe8f3" />
    <!-- cabin -->
    <path d="M262 62 h62 l40 46 v32 h-102 z" fill="url(#cab)" />
    <rect x="288" y="74" width="42" height="28" rx="6" fill="#eff5fa" />
    <!-- wheels -->
    <circle cx="58" cy="146" r="20" fill="#142f47" />
    <circle cx="58" cy="146" r="8" fill="#8cb2d4" />
    <circle cx="126" cy="146" r="20" fill="#142f47" />
    <circle cx="126" cy="146" r="8" fill="#8cb2d4" />
    <circle cx="316" cy="146" r="20" fill="#142f47" />
    <circle cx="316" cy="146" r="8" fill="#8cb2d4" />
  </g>

  <!-- road -->
  <path d="M60 600 h1080" stroke="#8cb2d4" stroke-width="6" stroke-linecap="round" opacity="0.5" />

  <!-- warehouse glyph -->
  <g transform="translate(880 360)" opacity="0.95">
    <path d="M0 60 l80 -46 l80 46 v96 h-160 z" fill="#ffffff" stroke="#b9d1e7" stroke-width="3" />
    <rect x="56" y="96" width="48" height="60" rx="6" fill="#dbe8f3" />
    <rect x="18" y="74" width="26" height="26" rx="5" fill="#14b8a6" opacity="0.7" />
    <rect x="116" y="74" width="26" height="26" rx="5" fill="#14b8a6" opacity="0.4" />
  </g>
</svg>
