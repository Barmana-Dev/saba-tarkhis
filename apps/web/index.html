<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صبا ترخیص | خدمات ترخیص کالا و مشاوره گمرکی</title>
    <meta
      name="description"
      content="صبا ترخیص؛ خدمات تخصصی ترخیص کالا، مشاوره امور گمرکی و سامانه ثبت و پیگیری درخواست ترخیص. وضعیت‌های نمایش‌داده‌شده، وضعیت رسیدگی داخلی شرکت هستند."
    />
    <meta name="theme-color" content="#142f47" />
    <meta property="og:site_name" content="صبا ترخیص" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:type" content="website" />
    <!--
      The four Vazirmatn weights the interface uses, fetched before first paint
      so text does not swap mid-render. Same URLs as the @font-face rules.
    -->
    <link
      rel="preload"
      href="/fonts/Vazirmatn-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Vazirmatn-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Vazirmatn-SemiBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Vazirmatn-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <noscript>
      برای استفاده از سامانه صبا ترخیص، لطفاً جاوااسکریپت مرورگر را فعال کنید.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
